name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Installed explicitly: npm may skip puppeteer's postinstall download.
      - name: Install headless Chromium
        run: npx puppeteer browsers install chrome

      # executablePath() returns a Promise from puppeteer 25 on.
      - name: Resolve headless Chromium binary
        run: echo "CHROME_BIN=$(node -e "Promise.resolve(require('puppeteer').executablePath()).then(p => console.log(p))")" >> "$GITHUB_ENV"

      - name: Test
        run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox

      - name: Build
        run: npm run build
