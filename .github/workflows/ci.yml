name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Resolve headless Chromium binary
        run: echo "CHROME_BIN=$(node -e "console.log(require('puppeteer').executablePath())")" >> "$GITHUB_ENV"

      - name: Test
        run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox

      - name: Build
        run: npm run build
